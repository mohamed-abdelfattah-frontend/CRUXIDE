name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Validate workflow policy
        working-directory: .
        run: node scripts/validate-workflows.mjs
      - name: Type-check source
        run: npm run typecheck
      - name: Lint source
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --audit-level=high
      - name: Verify package signatures
        run: npm run verify:signatures
      - name: Extension Host smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:test
      - name: Extension Host smoke test
        if: runner.os != 'Linux'
        run: npm run smoke:test

  package:
    name: Package release
    needs: verify
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build release artifacts
        run: npm run package:release
      - name: Create artifact checksums
        run: (cd release && sha256sum ./*.vsix ./*.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cruxide-release
          path: |
            source/release/*.vsix
            source/release/*.zip
            source/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
