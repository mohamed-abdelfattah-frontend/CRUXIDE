name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate release tag and metadata
        run: npm run verify:release -- "$GITHUB_REF_NAME"
      - name: Build release artifacts
        run: npm run package:release
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > release/cruxide-sbom.cdx.json
      - name: Create artifact checksums
        run: (cd release && sha256sum ./*.vsix ./*.zip ./*.json > SHA256SUMS.txt)
      - name: Attest release provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release/*.vsix
      - name: Attest release SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release/*.vsix
          sbom-path: release/cruxide-sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cruxide-${{ github.ref_name }}
          path: |
            release/*.vsix
            release/*.zip
            release/cruxide-sbom.cdx.json
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.vsix release/*.zip release/cruxide-sbom.cdx.json release/SHA256SUMS.txt --verify-tag --generate-notes
