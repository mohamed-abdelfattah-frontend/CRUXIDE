name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Validate release tag and metadata
        run: npm run verify:release -- "$GITHUB_REF_NAME"
      - name: Build release artifacts
        run: npm run package:release
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > release/cruxide-sbom.cdx.json
      - name: Create artifact checksums
        run: (cd release && sha256sum ./*.vsix ./*.zip ./*.json > SHA256SUMS.txt)
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: source/release/*.vsix
      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: source/release/*.vsix
          sbom-path: source/release/cruxide-sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cruxide-${{ github.ref_name }}
          path: |
            source/release/*.vsix
            source/release/*.zip
            source/release/cruxide-sbom.cdx.json
            source/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.vsix release/*.zip release/cruxide-sbom.cdx.json release/SHA256SUMS.txt --verify-tag --generate-notes
