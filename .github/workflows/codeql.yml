name: CodeQL

on:
  pull_request:
    paths: ['source/**', '.github/workflows/codeql.yml']
  push:
    branches: [main]
    paths: ['source/**', '.github/workflows/codeql.yml']
  schedule:
    - cron: '17 3 * * 1'

permissions:
  actions: read
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@c20e34f438d671fc35777cc9820dd7adf8252874 # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          upload: never
          output: ${{ runner.temp }}/codeql-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-sarif
          path: ${{ runner.temp }}/codeql-results/*.sarif
          if-no-files-found: error
