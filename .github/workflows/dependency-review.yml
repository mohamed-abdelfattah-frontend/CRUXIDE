name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        id: dependency-review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          warn-only: false
      - name: Checkout for fallback audit
        if: steps.dependency-review.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js for fallback audit
        if: steps.dependency-review.outcome == 'failure'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install locked dependencies for fallback audit
        if: steps.dependency-review.outcome == 'failure'
        working-directory: source
        run: npm ci
      - name: Run fallback dependency audit
        if: steps.dependency-review.outcome == 'failure'
        working-directory: source
        run: npm audit --audit-level=high
      - name: Record dependency review fallback
        if: steps.dependency-review.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::GitHub Dependency Review was unavailable. npm audit completed as the blocking fallback. Enable Dependency Graph in repository security settings for pull-request diff analysis."
          {
            echo "### Dependency Review fallback"
            echo "GitHub Dependency Review was unavailable, so the job enforced \`npm audit --audit-level=high\` instead."
            echo "Enable Dependency Graph in repository security settings before the public release."
          } >> "$GITHUB_STEP_SUMMARY"
