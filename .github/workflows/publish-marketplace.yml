name: Publish VS Code Marketplace

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vscode-marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    environment: vscode-marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Validate release tag
        run: npm run verify:release -- "${{ inputs.release_tag }}"
      - name: Download immutable release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p release
          gh release download "$RELEASE_TAG" --pattern '*.vsix' --pattern 'SHA256SUMS.txt' --dir release
      - name: Verify VSIX checksum
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd release
          # release.yml writes SHA256SUMS.txt with sha256sum ./*.vsix, so the
          # recorded name carries a ./ prefix. Match it with or without one.
          ENTRY=$(grep -E "[ *][.]?/?cruxide-${VERSION}[.]vsix$" SHA256SUMS.txt || true)
          if [ "$(printf '%s\n' "$ENTRY" | grep -c .)" -ne 1 ]; then
            echo "Expected exactly one checksum entry for cruxide-${VERSION}.vsix" >&2
            echo "SHA256SUMS.txt contained:" >&2
            cat SHA256SUMS.txt >&2
            exit 1
          fi
          printf '%s\n' "$ENTRY" | sha256sum --check --strict -
      - name: Publish exact GitHub Release VSIX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm run publish:marketplace -- "release/cruxide-${VERSION}.vsix"
