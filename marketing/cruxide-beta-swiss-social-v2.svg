  <text x="2008" y="250" text-anchor="end" font-family="Arial, sans-serif" fill="#A7ADBA" font-size="24" letter-spacing="5">CRUXIDE / 01</text>

  <!-- Main editorial title -->
  <text x="92" y="520" font-family="Arial, sans-serif" fill="#5E6470" font-size="30" font-weight="700" letter-spacing="9">A DEVELOPER-CONTROLLED AI WORKFLOW</text>
  <text x="70" y="874" font-family="Arial, sans-serif" fill="#0B0D12" font-size="320" font-weight="700" letter-spacing="-22">CRUX</text>
  <text x="70" y="1160" font-family="Arial, sans-serif" fill="#0B0D12" font-size="320" font-weight="700" letter-spacing="-22">IDE.</text>
  <rect x="1170" y="648" width="838" height="486" fill="#245CFF"/>
  <text x="1228" y="754" font-family="Arial, sans-serif" fill="#FFFFFF" font-size="30" font-weight="700" letter-spacing="7">THE CRUX IS CONTROL.</text>
  <text x="1228" y="874" font-family="Arial, sans-serif" fill="#FFFFFF" font-size="63" font-weight="700">AI writes the code.</text>
  <text x="1228" y="958" font-family="Arial, sans-serif" fill="#FFFFFF" font-size="63" font-weight="700">You set the rules.</text>
  <path d="M1230 1044H1870" stroke="#FFFFFF" stroke-width="5"/>
  <path d="M1870 1024l42 20-42 20z" fill="#FFFFFF"/>

  <!-- Pipeline -->
  <rect x="92" y="1322" width="1976" height="6" fill="#0B0D12"/>
  <text x="92" y="1428" font-family="Arial, sans-serif" fill="#0B0D12" font-size="28" font-weight="700" letter-spacing="8">ONE PROMPT / ONE COORDINATED RESULT</text>

  <g font-family="Arial, sans-serif">
    <g transform="translate(92 1510)">
      <rect width="438" height="370" fill="#0B0D12"/>
      <text x="30" y="58" fill="#2BCBFF" font-size="24" font-weight="700" letter-spacing="5">01 / SELECT</text>
      <text x="30" y="184" fill="#F2EFE7" font-size="62" font-weight="700">SKILLS</text>
      <text x="30" y="252" fill="#A7ADBA" font-size="25">Use only what the</text>
      <text x="30" y="290" fill="#A7ADBA" font-size="25">current task needs.</text>
      <circle cx="378" cy="62" r="18" fill="#245CFF"/>
    </g>
    <g transform="translate(604 1510)">
      <rect width="438" height="370" fill="#FFFFFF" stroke="#0B0D12" stroke-width="4"/>
      <text x="30" y="58" fill="#5E6470" font-size="24" font-weight="700" letter-spacing="5">02 / GUIDE</text>
      <text x="30" y="184" fill="#0B0D12" font-size="62" font-weight="700">RULES</text>
      <text x="30" y="252" fill="#5E6470" font-size="25">Make project standards</text>
      <text x="30" y="290" fill="#5E6470" font-size="25">part of the context.</text>
      <circle cx="378" cy="62" r="18" fill="#F2EFE7" stroke="#0B0D12" stroke-width="4"/>
    </g>
    <g transform="translate(1116 1510)">
      <rect width="438" height="370" fill="#FF4A38"/>
      <text x="30" y="58" fill="#0B0D12" font-size="24" font-weight="700" letter-spacing="5">03 / REVIEW</text>
      <text x="30" y="167" fill="#0B0D12" font-size="55" font-weight="700">CODE</text>
      <text x="30" y="230" fill="#0B0D12" font-size="55" font-weight="700">REVIEW</text>
      <text x="30" y="298" fill="#0B0D12" font-size="25">Find evidence, risk</text>
      <text x="30" y="336" fill="#0B0D12" font-size="25">and breaking changes.</text>
      <circle cx="378" cy="62" r="18" fill="#0B0D12"/>
    </g>
    <g transform="translate(1630 1510)">
      <rect width="438" height="370" fill="#0B0D12"/>
      <text x="30" y="58" fill="#2BCBFF" font-size="24" font-weight="700" letter-spacing="5">04 / SHIP</text>
      <text x="30" y="167" fill="#F2EFE7" font-size="46" font-weight="700">ONE</text>
      <text x="30" y="225" fill="#F2EFE7" font-size="46" font-weight="700">RESULT</text>
      <text x="30" y="298" fill="#A7ADBA" font-size="25">Coordinated, reviewed</text>
      <text x="30" y="336" fill="#A7ADBA" font-size="25">and ready to verify.</text>
      <circle cx="378" cy="62" r="18" fill="#245CFF"/>
    </g>
  </g>

  <!-- Mascot stage: raster mascot is composited after deterministic SVG export. -->
  <rect x="92" y="1974" width="1190" height="322" fill="#0B0D12"/>
  <text x="142" y="2055" font-family="Arial, sans-serif" fill="#2BCBFF" font-size="27" font-weight="700" letter-spacing="5">DEVELOPER IN CONTROL</text>
  <text x="142" y="2162" font-family="Arial, sans-serif" fill="#F2EFE7" font-size="60" font-weight="700">AI works with your skills.</text>
  <text x="142" y="2238" font-family="Arial, sans-serif" fill="#F2EFE7" font-size="60" font-weight="700">Code follows your rules.</text>
